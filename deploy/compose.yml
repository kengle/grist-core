---
# Caddy is the only public entry. Grist and the MCP bridge share one container.
services:
  lldap:
    image: 'lldap/lldap:v0.6.3'
    restart: 'unless-stopped'
    env_file:
      - './lldap.env'
    ports:
      - '127.0.0.1:${LDAP_PORT:-3890}:3890'    # LDAP
      - '127.0.0.1:${LLDAP_WEB_PORT:-17170}:17170'  # web admin / GraphQL
    volumes:
      - '${DATA_ROOT:-./state}/lldap:/data'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:17170/health || exit 1']
      interval: '15s'
      timeout: '5s'
      retries: 5
      start_period: '20s'

  authelia:
    image: 'authelia/authelia:4.39.28'
    restart: 'unless-stopped'
    env_file:
      - './lldap.env'          # supplies AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
    volumes:
      - '${DATA_ROOT:-./state}/authelia:/config'

  grist:
    # Build from the repository root, or set GRIST_IMAGE to a published image.
    image: '${GRIST_IMAGE:-grist-merged:local}'
    build:
      context: '..'
      dockerfile: 'Dockerfile'
      args:
        BUILD_PYODIDE_SANDBOX: '0'
    restart: 'unless-stopped'
    env_file:
      - './grist.env'
    volumes:
      - '${DATA_ROOT:-./state}/grist:/persist'

  caddy:
    image: 'caddy:2'
    restart: 'unless-stopped'
    environment:
      GRIST_DOMAIN: '${GRIST_DOMAIN:?set GRIST_DOMAIN}'
      GRIST_SESSION_COOKIE: '${GRIST_SESSION_COOKIE:-grist_core}'
    depends_on:
      - 'authelia'
      - 'grist'
    ports:
      - '127.0.0.1:${PUBLIC_PORT:-443}:443'
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy-data:/data'

volumes:
  caddy-data:
